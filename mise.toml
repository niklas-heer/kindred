[tools]
node = "26"
# The CI pipeline (.dagger/, .github/workflows/ci.yml) runs this same Dagger release, pinned in dagger.json too.
dagger = "0.21.9"

[env]
# The project's own tools (vite, tsc, wrangler) live in node_modules/.bin, which mise run does not put on PATH.
_.path = ["node_modules/.bin"]

[tasks.install]
run = "npm install"

[tasks.data]
description = "Generate the test families and rebuild their databases"
run = [
  "node scripts/gen-realm.ts",
  "node scripts/gen-modern.ts",
  "node scripts/seed.ts --force data/seed/realm.json data/seed/modern.json",
]

[tasks.demo]
description = "Run a public demo on Node: builds the server, makes the two invented families fresh in .demo/data (or KINDRED_DATA_DIR) and starts it read-only with KINDRED_DEMO=1 on PORT (4901). docs/self-host.md, A public demo"
env = { KINDRED_TARGET = "node" }
run = ["vite build", "node scripts/demo.ts"]

[tasks."demo:cf"]
description = "Make the D1 databases of a Cloudflare demo from the invented families (deploy/demo/): --local (default) or --remote, --env, --config. Never run --remote unless you mean to"
run = 'node deploy/demo/seed-d1.ts "$@"'

[tasks.seed]
description = "Build missing data/*.db from data/seed/ (existing ones are kept; pass --force to rebuild with a backup)"
run = "node scripts/seed.ts"

[tasks.gazetteer]
description = "Download GeoNames cities500 once and build data/gazetteer.db for offline place search (~40 MB; downloads are deleted)"
run = "node scripts/gazetteer.ts"

[tasks."cf:gazetteer"]
description = "Load data/gazetteer.db (mise run gazetteer) into the GAZETTEER D1 database for assisted place entry on Workers: --local --env local, or --remote; --source, --persist-to, --rows. Attribution: GeoNames, CC BY 4.0"
run = 'node scripts/gazetteer-to-d1.ts "$@"'

[tasks.dev]
description = "Run on Node with the SQLite files in data/ (http://localhost:4517)"
run = "vite dev"

[tasks."dev:cf"]
description = "Run the Worker in workerd with local D1 and R2 (wrangler env `local`); `mise run cf:seed` loads the test families"
depends = ["cf:migrate"]
env = { CLOUDFLARE_ENV = "local" }
run = "vite dev"

[tasks."cf:migrate"]
description = "Apply migrations/ to every local D1 database in wrangler.jsonc (env `local`)"
run = "node scripts/cf-migrate.ts --env local"

[tasks."cf:migrate:remote"]
description = "Apply migrations/ to the deployed D1 databases (needs `wrangler login`)"
run = "node scripts/cf-migrate.ts --remote"

[tasks."cf:seed"]
description = "Copy data/modern.db and data/realm.db into the local D1 databases (replacing what is there)"
depends = ["cf:migrate"]
run = "node scripts/import-to-d1.ts modern realm --env local --replace"

[tasks.check]
run = "tsc --noEmit"

[tasks.lint]
description = "Lint with oxlint: unused code, React hook rules and the correctness checks (npm run lint)"
run = "npm run lint"

[tasks."i18n:check"]
description = "Check the translations: every language's summary, or one language's findings (mise run i18n:check -- fr); docs/translating.md"
run = "node scripts/i18n-check.ts"

[tasks."i18n:scaffold"]
description = "Give every language a file for each area and rewrite its index (src/lib/i18n/locales/); docs/translating.md"
run = "node scripts/i18n-scaffold.ts"

[tasks."ai-eval"]
description = "Measure which AI models do Kindred's jobs best, on made-up data. Sends real requests and costs money: --provider, --models, --max-usd (default 1, one budget for the whole run), --web, --out, --dry-run (plans and estimates, sends nothing). Key: KINDRED_AI_EVAL_KEY or --saved-family. --provider cursor: a subscription through the agent CLI, no key or budget"
run = 'node scripts/ai-eval.ts "$@"'

[tasks.test]
description = "Unit tests, every *.test.ts under src, scripts and server, as CI runs them (npm test)"
run = "npm test"

[tasks.e2e]
description = "Browser journeys: builds the Node server, then Playwright on a scratch data folder with the fake AI provider. One worker, using the installed Brave; downloads no browser (KINDRED_E2E_BROWSER names another Chromium, KINDRED_E2E_PORT the port, 5251). Prints what axe found. Pass Playwright arguments after --"
env = { KINDRED_TARGET = "node" }
run = ["vite build", 'playwright test "$@"']

[tasks.build]
description = "Build the Worker (dist/); KINDRED_TARGET=node builds for Node instead"
run = "vite build"

[tasks."build:node"]
description = "Build the production server for Node into dist/ (run mise run start afterwards)"
env = { KINDRED_TARGET = "node" }
run = "vite build"

[tasks.start]
description = "Run the production Node server from dist/ (build it first): PORT (4901), HOST (127.0.0.1), KINDRED_DATA_DIR (data/)"
run = "node server/node.ts"

[tasks.deploy]
description = "Build, apply migrations/ to the deployed D1 databases, then deploy to Cloudflare; any step that fails stops the rest (needs `wrangler login` and the D1/R2 ids in wrangler.jsonc)"
run = ["vite build", "node scripts/cf-migrate.ts --remote", "npx wrangler deploy"]

[tasks."vapid-keys"]
description = "Make the VAPID key pair for Web Push reminders and print its three settings (docs/self-host.md, Reminders)"
run = "node scripts/vapid-keys.ts"

[tasks.clean]
description = "Remove build output and generated databases"
run = "rm -rf dist .output .tanstack .wrangler data/*.db data/*.db-wal data/*.db-shm data/media"

[tasks.screenshots]
description = "Retake the README pictures in docs/images/ (WebP) from the two invented families: builds the Node server, runs it on scratch data with the fake AI provider, drives the installed Brave (KINDRED_E2E_BROWSER names another Chromium) and needs cwebp (brew install webp). --use-dist skips the build, --only tree,person,... takes some, --out <folder> writes elsewhere"
run = 'node scripts/screenshots.ts "$@"'

[tasks.sweep]
description = "Open every main page of a running demo in Safari's engine and list the pages the browser draws differently from the server: node scripts/hydration-sweep.ts <origin> (needs `npx playwright install webkit` once)"
run = 'node scripts/hydration-sweep.ts "$@"'

[tasks."smoke:worker"]
description = "Build the Worker into a scratch folder, run it locally (workerd, empty local D1 and R2) and check its routes; never contacts Cloudflare"
run = "node scripts/worker-smoke.ts"

[tasks.ci]
description = "Run the CI pipeline in Dagger, as .github/workflows/ci.yml does: the checks, then the Docker build (needs a container engine: on macOS `colima start`)"
run = ["dagger call ci", "dagger call docker"]
