[tools]
node = "26"

[env]
# The project's own tools (vite, tsc, wrangler) live in node_modules/.bin, which mise run does not put on PATH.
_.path = ["node_modules/.bin"]

[tasks.install]
run = "npm install"

[tasks.data]
description = "Generate the test families and rebuild their databases"
run = [
  "node scripts/gen-realm.ts",
  "node scripts/gen-modern.ts",
  "node scripts/seed.ts --force data/seed/realm.json data/seed/modern.json",
]

[tasks.seed]
description = "Build missing data/*.db from data/seed/ (existing ones are kept; pass --force to rebuild with a backup)"
run = "node scripts/seed.ts"

[tasks.gazetteer]
description = "Download GeoNames cities500 once and build data/gazetteer.db for offline place search (~40 MB; downloads are deleted)"
run = "node scripts/gazetteer.ts"

[tasks.dev]
description = "Run on Node with the SQLite files in data/ (http://localhost:4517)"
run = "vite dev"

[tasks."dev:cf"]
description = "Run the Worker in workerd with local D1 and R2 (wrangler env `local`); `mise run cf:seed` loads the test families"
depends = ["cf:migrate"]
env = { CLOUDFLARE_ENV = "local" }
run = "vite dev"

[tasks."cf:migrate"]
description = "Apply migrations/ to every local D1 database in wrangler.jsonc (env `local`)"
run = "node scripts/cf-migrate.ts --env local"

[tasks."cf:migrate:remote"]
description = "Apply migrations/ to the deployed D1 databases (needs `wrangler login`)"
run = "node scripts/cf-migrate.ts --remote"

[tasks."cf:seed"]
description = "Copy data/modern.db and data/realm.db into the local D1 databases (replacing what is there)"
depends = ["cf:migrate"]
run = "node scripts/import-to-d1.ts modern realm --env local --replace"

[tasks.check]
run = "tsc --noEmit"

[tasks.test]
description = "Unit tests: accounts, Access, the storage layer"
run = "node --test src/lib/auth/*.test.ts src/lib/store/*.test.ts src/lib/*.test.ts src/lib/exchange/*.test.ts src/lib/i18n/*.test.ts src/lib/jobs/*.test.ts scripts/*.test.ts server/*.test.ts"

[tasks.build]
description = "Build the Worker (dist/); KINDRED_TARGET=node builds for Node instead"
run = "vite build"

[tasks."build:node"]
description = "Build the production server for Node into dist/ (run mise run start afterwards)"
env = { KINDRED_TARGET = "node" }
run = "vite build"

[tasks.start]
description = "Run the production Node server from dist/ (build it first): PORT (4901), HOST (127.0.0.1), KINDRED_DATA_DIR (data/)"
run = "node server/node.ts"

[tasks.deploy]
description = "Build and deploy to Cloudflare (needs `wrangler login` and the D1/R2 ids in wrangler.jsonc)"
run = ["vite build", "npx wrangler deploy"]

[tasks."vapid-keys"]
description = "Make the VAPID key pair for Web Push reminders and print its three settings (docs/self-host.md, Reminders)"
run = "node scripts/vapid-keys.ts"

[tasks.clean]
description = "Remove build output and generated databases"
run = "rm -rf dist .output .tanstack .wrangler data/*.db data/*.db-wal data/*.db-shm data/media"

[tasks."smoke:worker"]
description = "Build the Worker into a scratch folder, run it locally (workerd, empty local D1 and R2) and check its routes; never contacts Cloudflare"
run = "node scripts/worker-smoke.ts"
