# Kindred on Docker: the app with its data in a named volume, and an optional Caddy in front for HTTPS.
#
#   cp .env.example .env                           # then edit it; docs/self-host.md explains each line
#   docker compose up -d --build                   # the app, on http://localhost:4901 (this machine only)
#   docker compose --profile https up -d --build   # HTTPS on $KINDRED_DOMAIN, certificates from Let's Encrypt
#   docker compose logs app                        # shows the setup code, when KINDRED_SETUP_CODE=required
#   docker compose --profile demo up -d --build demo   # a public, read-only demo of the invented families on
#                                                      # http://localhost:4902 (docs/self-host.md, "A public demo")
name: kindred

services:
  app:
    build:
      context: .
      args:
        WITH_GAZETTEER: ${WITH_GAZETTEER:-0}
        # The commit shown in a steward's feedback report. The build has no .git, so set it:
        #   KINDRED_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        KINDRED_COMMIT: ${KINDRED_COMMIT:-unknown}
    image: kindred:local
    restart: unless-stopped
    # Time for in-flight requests to finish and the databases to close after `docker stop`.
    stop_grace_period: 20s
    # The settings from .env that the app reads (docs/self-host.md, "Settings"). Compose does not pass .env into the
    # container by itself, so each one is listed here. An empty value is the same as not setting it.
    environment:
      KINDRED_ORIGIN: ${KINDRED_ORIGIN:-http://localhost:4901}
      KINDRED_SETUP_CODE: ${KINDRED_SETUP_CODE:-}
      KINDRED_REQUIRE_SETUP_CODE: ${KINDRED_REQUIRE_SETUP_CODE:-}
      KINDRED_AUTH: ${KINDRED_AUTH:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # With Cloudflare Access: the guest host that share links point at (docs/deploy-cloudflare.md, "Guests behind Access").
      KINDRED_GUEST_ORIGIN: ${KINDRED_GUEST_ORIGIN:-}
      KINDRED_DEFAULT_TREE: ${KINDRED_DEFAULT_TREE:-}
      KINDRED_SECRET: ${KINDRED_SECRET:-}
      KINDRED_VAPID_PUBLIC_KEY: ${KINDRED_VAPID_PUBLIC_KEY:-}
      KINDRED_VAPID_PRIVATE_JWK: ${KINDRED_VAPID_PRIVATE_JWK:-}
      KINDRED_VAPID_SUBJECT: ${KINDRED_VAPID_SUBJECT:-}
      KINDRED_JOBS: ${KINDRED_JOBS:-}
      # A public, read-only demo (docs/self-host.md, "A public demo"). The demo profile below sets it for its own service; leave
      # it empty here unless this whole app is meant to be one.
      KINDRED_DEMO: ${KINDRED_DEMO:-}
      # off: the address box suggests towns only, and never asks OpenStreetMap (Photon) for whole addresses. Default on.
      KINDRED_ADDRESS_LOOKUP: ${KINDRED_ADDRESS_LOOKUP:-}
      # Years of each family's change history the daily run keeps (default 3; 0 keeps it for ever).
      KINDRED_HISTORY_YEARS: ${KINDRED_HISTORY_YEARS:-}
      # 1 with the https profile: Caddy is the one proxy in front, and the rate limits then count each visitor's own
      # address rather than Caddy's. Leave it empty without Caddy.
      KINDRED_TRUSTED_PROXIES: ${KINDRED_TRUSTED_PROXIES:-}
    ports:
      # Only this machine can reach the app directly. With the https profile, Caddy is the way in.
      # For plain-HTTP use on a home network, change this to "4901:4901" and read docs/self-host.md first.
      - "127.0.0.1:4901:4901"
    volumes:
      - kindred-data:/data

  # The demo profile: the two invented families, made fresh on every start by the image's build stage (which has the
  # generators), then the app on them with KINDRED_DEMO=1: no sign-in, read-only. Its own volume, never the app's data.
  # Settings that need accounts or push are not passed: the demo refuses to start beside them.
  demo-data:
    profiles: ["demo"]
    build:
      context: .
      target: build
    image: kindred:build
    environment:
      KINDRED_DATA_DIR: /data
    # The app runs as the image's unprivileged node user, so the files it opens are handed to it.
    command: ["sh", "-c", "node scripts/demo.ts --data-only && chown -R node:node /data"]
    volumes:
      - kindred-demo-data:/data

  demo:
    profiles: ["demo"]
    build:
      context: .
      args:
        KINDRED_COMMIT: ${KINDRED_COMMIT:-unknown}
    image: kindred:local
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      demo-data:
        condition: service_completed_successfully
    environment:
      KINDRED_DEMO: "1"
      KINDRED_ORIGIN: ${KINDRED_DEMO_ORIGIN:-http://localhost:4902}
      KINDRED_JOBS: "off"
      KINDRED_TRUSTED_PROXIES: ${KINDRED_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:4902:4901"
    volumes:
      - kindred-demo-data:/data

  caddy:
    image: caddy:2.11
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      KINDRED_DOMAIN: ${KINDRED_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kindred-data:
  kindred-demo-data:
  caddy-data:
  caddy-config:
