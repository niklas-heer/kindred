name: Update Kindred

# For a copy of Kindred made by the Deploy to Cloudflare button (docs/deploy-cloudflare.md, "One-click deploy"). The operator
# console's Update button runs it (docs/hosting-many-families.md, "Updates"); "Run workflow" here does the same by hand.
#
# The button copies the repository as a fresh one, with no history in common with Kindred's, so this is not a merge: it puts
# the release's files in place as one commit on top of the copy's branch, keeping the files the install owns, and pushes.
# Workers Builds sees the push and deploys. Kept as they are in the copy:
#   wrangler.jsonc     the copy's bindings, ids, names, vars and jurisdiction
#   .github/           the copy's workflows (this file too; a token from Actions may not change workflows anyway)
#   .kindred-keep      more paths to keep, one per line (for example a changed public/favicon.svg); # starts a comment
#   .kindred-release   the release this copy has now, written here; a tag older than it is refused, so a leaked token
#                      cannot move the copy back (going back on purpose: revert the update's commit). A fresh copy has
#                      none yet: its package.json version stands in for it
# Every other file is the release's: a file the copy added and did not list in .kindred-keep is removed.
# This file cannot update itself (it is under .github/, which is kept, and a token from Actions may not change workflows): when a
# release changes it, copy the release's .github/workflows/update.yml over yours by hand and push (docs/hosting-many-families.md).
# When the release changes Kindred's own wrangler.jsonc since the copy's last release, the run says so (a warning and the
# difference in its summary), because the copy keeps its own: compare and carry over by hand. A release that needs that is
# marked "manual", and the console's button refuses it.
#
# Runs only in a copy, never in Kindred's own repository. Nothing here needs a secret: the job's own token pushes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to update to (for example v2.4.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: kindred-update
  cancel-in-progress: false

jobs:
  update:
    name: Update to the release
    if: github.repository != 'niklas-heer/kindred' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Read through the environment, never pasted into a script.
      TAG: ${{ inputs.tag }}
      # A fork of Kindred to follow instead: the repository variable KINDRED_UPSTREAM (a https://github.com/owner/name address).
      UPSTREAM: ${{ vars.KINDRED_UPSTREAM || 'https://github.com/niklas-heer/kindred' }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check the tag and the upstream address
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          [[ "$UPSTREAM" =~ ^https://github\.com/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$ ]] || { echo "::error::KINDRED_UPSTREAM must be https://github.com/owner/name"; exit 1; }
      # The job's token stays in the checkout's settings for the push at the end, and nothing else uses it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      # Never backwards: a token that can start this workflow (the console's, if it leaked) must not be able to move the install
      # to an older release with known holes. To go back on purpose, revert the update's commit instead.
      - name: Refuse a release older than the copy has
        run: |
          prev=""
          if [[ -f .kindred-release ]]; then prev=$(tr -d '[:space:]' < .kindred-release); fi
          # A record that is not a release (hand-edited, empty) counts as none: package.json decides then.
          [[ "$prev" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || prev=""
          # A fresh copy has no record yet (no release ships one): the version its package.json names is the release it has.
          if [[ -z "$prev" && -f package.json ]]; then
            version=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' package.json | head -n 1)
            [[ -n "$version" ]] && prev="v$version"
          fi
          # Fail closed: a copy whose release cannot be read (a prerelease version, a hand-edited file) is not updated blindly.
          if [[ ! "$prev" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot tell which release this copy has (.kindred-release or package.json gives '${prev:-nothing}'). Write the release you run, such as v2.4.0, into .kindred-release and run the update again."
            exit 1
          fi
          if [[ "$prev" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            have=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            want=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            for i in 0 1 2; do
              if (( 10#${want[i]} > 10#${have[i]} )); then exit 0; fi
              if (( 10#${want[i]} < 10#${have[i]} )); then
                echo "::error::$TAG is older than $prev, the release this copy has. An update never goes back; to return to an older release, revert the update's commit (docs/hosting-many-families.md, \"Going back\")."
                exit 1
              fi
            done
          fi
      - name: Fetch the release
        run: |
          git fetch --no-tags --depth=1 "$UPSTREAM" "refs/tags/$TAG"
          echo "RELEASE=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_ENV"
      - name: Compare Kindred's wrangler.jsonc with the copy's last release
        run: |
          prev=""
          [[ -f .kindred-release ]] && prev=$(tr -d '[:space:]' < .kindred-release)
          if [[ "$prev" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$prev" != "$TAG" ]] && git fetch --no-tags --depth=1 "$UPSTREAM" "refs/tags/$prev"; then
            if ! git diff --quiet FETCH_HEAD "$RELEASE" -- wrangler.jsonc; then
              echo "::warning::Kindred's wrangler.jsonc changed between $prev and $TAG. Your copy keeps its own: compare them and carry the change over by hand."
              { echo "### wrangler.jsonc changed in Kindred between $prev and $TAG"; echo; echo '```diff'; git diff FETCH_HEAD "$RELEASE" -- wrangler.jsonc; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$prev" != "$TAG" ]]; then
            echo "The copy's last release is not known; its own wrangler.jsonc is kept as it is."
          fi
      - name: Put the release in place, keeping the install's own files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          keep=(wrangler.jsonc .github .kindred-keep)
          if [[ -f .kindred-keep ]]; then
            while IFS= read -r line; do
              line="${line%%#*}"
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              [[ -z "$line" || "$line" == /* || "$line" == *..* ]] && continue
              keep+=("$line")
            done < .kindred-keep
          fi
          # A separate index: start from the release's files, then put back each kept path as the copy has it.
          export GIT_INDEX_FILE="$RUNNER_TEMP/kindred-index"
          git read-tree "$RELEASE"
          for path in "${keep[@]}"; do
            git rm -r -q -f --cached --ignore-unmatch -- "$path"
            git ls-tree -r HEAD -- "$path" | git update-index --index-info
          done
          blob=$(printf '%s\n' "$TAG" | git hash-object -w --stdin)
          git update-index --add --cacheinfo "100644,$blob,.kindred-release"
          tree=$(git write-tree)
          if [[ "$tree" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "Already at $TAG: nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          commit=$(git commit-tree "$tree" -p HEAD -m "chore: update Kindred to $TAG" -m "The files of $UPSTREAM at $TAG ($RELEASE), keeping: ${keep[*]}.")
          git push origin "$commit:refs/heads/$BRANCH"
          echo "Updated $BRANCH to Kindred $TAG ($commit). Workers Builds deploys it now." | tee -a "$GITHUB_STEP_SUMMARY"
