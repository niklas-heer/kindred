name: Release

# A pushed tag v* builds the Docker image for amd64 and arm64 and publishes it to ghcr.io/niklas-heer/kindred
# as <version> (for v2.1.0: 2.1.0) and latest. The image is the
# Dockerfile's, built without the offline place search (WITH_GAZETTEER stays 0). It is the same build `dagger call docker` checks.
#
# Each architecture is built on a runner of its own kind (arm64 on GitHub's arm runner, not under QEMU: emulated, the
# arm64 build outgrew the hour from 2.2.0 on) and pushed by digest; a last job joins the two digests under the tags.
# "Run workflow" with a tag publishes an existing release again, from that tag's commit, without moving `latest`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish (for example v2.3.0)"
        required: true
        type: string

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

env:
  IMAGE: ghcr.io/niklas-heer/kindred
  # The tag being published: the pushed one, or the one asked for. Read through the environment, never pasted into a script.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  amd64:
    name: Build amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check the tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $RELEASE_TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Kindred
            org.opencontainers.image.description=A family tree your whole family can share
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            KINDRED_COMMIT=${{ steps.commit.outputs.sha }}

  arm64:
    name: Build arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check the tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $RELEASE_TAG"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=Kindred
            org.opencontainers.image.description=A family tree your whole family can share
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            KINDRED_COMMIT=${{ steps.commit.outputs.sha }}

  image:
    name: Publish image
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          # Only a pushed tag moves `latest`: publishing an older release again must not take it back.
          flavor: latest=${{ github.event_name == 'push' }}
      - name: Join the two architectures under the tags
        env:
          AMD64: ${{ needs.amd64.outputs.digest }}
          ARM64: ${{ needs.arm64.outputs.digest }}
        run: |
          tags=$(jq -r '.tags[] | "-t " + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:${RELEASE_TAG#v}"
