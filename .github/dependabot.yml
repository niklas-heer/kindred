version: 2
updates:
  # Keeps the pinned action SHAs in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The app's packages, in one weekly pull request; a security update still arrives on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
